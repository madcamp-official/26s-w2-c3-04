<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI 인생네컷 프로토타입</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Malgun Gothic", sans-serif;
    background: #1a1a1a;
    color: #eee;
    margin: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }
  h1 { font-size: 18px; font-weight: 500; margin: 0 0 16px; }
  .stage-wrap { position: relative; width: 640px; max-width: 100%; }
  video, canvas.overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: auto;
    border-radius: 8px;
    transform: scaleX(-1); /* 거울모드 */
  }
  video { position: relative; display: block; background: #000; }
  .status-bar {
    width: 640px; max-width: 100%;
    margin-top: 14px;
    text-align: center;
  }
  .gesture-name {
    font-size: 26px;
    font-weight: 500;
    margin: 4px 0;
  }
  .guide-caption {
    font-size: 14px;
    color: #bbb;
    margin: 0 0 4px;
  }
  .sub-status {
    font-size: 14px;
    color: #aaa;
    min-height: 20px;
  }
  .progress {
    font-size: 13px;
    color: #888;
    margin-top: 6px;
  }
  .countdown-num {
    font-size: 64px;
    font-weight: 700;
    color: #ffd54a;
  }
  .hint-hold {
    color: #6fdc8c;
  }
  .hint-wait {
    color: #888;
  }
  #logArea {
    width: 640px; max-width: 100%;
    font-size: 11px;
    color: #666;
    margin-top: 10px;
    text-align: left;
    white-space: pre-wrap;
    max-height: 60px;
    overflow-y: auto;
  }
  .grid8 {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
    width: 640px;
    max-width: 100%;
  }
  .thumb {
    position: relative;
    border-radius: 6px;
    overflow: hidden;
    cursor: pointer;
    border: 3px solid transparent;
  }
  .thumb img { width: 100%; display: block; }
  .thumb.selected { border-color: #ffd54a; }
  .thumb .badge {
    position: absolute; top: 4px; left: 4px;
    background: rgba(0,0,0,0.6);
    color: #fff; font-size: 10px;
    padding: 2px 6px; border-radius: 10px;
  }
  .thumb .order {
    position: absolute; top: 4px; right: 4px;
    background: #ffd54a; color: #1a1a1a;
    font-size: 12px; font-weight: 700;
    width: 20px; height: 20px; border-radius: 50%;
    display: none; align-items: center; justify-content: center;
  }
  .thumb.selected .order { display: flex; }
  button {
    background: #ffd54a;
    color: #1a1a1a;
    border: none;
    padding: 10px 22px;
    border-radius: 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 16px;
  }
  button:disabled { background: #555; color: #999; cursor: not-allowed; }
  .layout-toggle { display: flex; gap: 8px; margin-top: 10px; }
  .layout-toggle button {
    background: #333; color: #ccc; padding: 6px 14px; font-size: 12px; margin: 0;
  }
  .layout-toggle button.active { background: #ffd54a; color: #1a1a1a; }
  #finalCanvasWrap { margin-top: 16px; text-align: center; }
  #finalCanvas { max-width: 320px; border-radius: 8px; }
  .error-box {
    background: #442222; color: #ffb3b3;
    padding: 12px 16px; border-radius: 8px;
    font-size: 13px; margin-top: 16px; max-width: 600px;
  }
</style>
</head>
<body>

<h1>AI 인생네컷 (기능 프로토타입)</h1>

<div id="app">
  <div class="stage-wrap" id="captureStage">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="overlay" class="overlay"></canvas>
  </div>

  <div class="status-bar" id="statusBar">
    <div class="progress" id="progressText">준비 중...</div>
    <div class="gesture-name" id="gestureName">-</div>
    <div class="guide-caption" id="guideCaption"></div>
    <div class="sub-status" id="subStatus">카메라를 불러오는 중입니다</div>
    <div class="countdown-num" id="countdownNum"></div>
  </div>

  <div id="logArea"></div>
  <div id="errorBox"></div>
</div>

<div id="selectView" style="display:none;">
  <p style="text-align:center; color:#ccc;">마음에 드는 사진 4장을 선택하세요 (<span id="selCount">0</span>/4)</p>
  <div class="grid8" id="grid8"></div>
  <div style="text-align:center;">
    <div class="layout-toggle">
      <button id="layoutVertical" class="active">세로 1x4</button>
      <button id="layout2x2">2x2</button>
    </div>
    <button id="composeBtn" disabled>4컷 완성하기</button>
  </div>
</div>

<div id="resultView" style="display:none; text-align:center;">
  <div id="finalCanvasWrap">
    <canvas id="finalCanvas"></canvas>
  </div>
  <div>
    <button id="downloadBtn">다운로드</button>
    <button id="restartBtn">처음부터 다시</button>
  </div>
</div>

<script type="module">
import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

// ---------- 설정 ----------
const GESTURES = [
  { id: 'v', name: '브이 ✌️', minHands: 1 },
  { id: 'thumbsup', name: '엄지척 👍', minHands: 1 },
  { id: 'tigerclaw', name: '어흥 🐯', minHands: 1 },
  { id: 'catears', name: '고양이 귀 🐱', minHands: 1 },
  { id: 'cheekheart', name: '볼하트 💕', minHands: 1 },
  { id: 'bigheart', name: '양손하트 🫶', minHands: 2 },
  { id: 'flower', name: '꽃받침 🌸', minHands: 1 },
  { id: 'mouthpose', name: '숭이포즈 ☝️', minHands: 1 },
  { id: 'yahoo', name: '야호포즈 🙌', minHands: 1 },
  { id: 'palmpose', name: '놀라는 포즈 🖐️', minHands: 1 },
  { id: 'rocknroll', name: '락앤롤 포즈 🤟', minHands: 1 },
];

// 매 실행마다 6개 중 4개를 랜덤으로 뽑아서 진행 (재미 요소 + 매번 다른 조합)
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
const chosenGestures = shuffle(GESTURES).slice(0, 4);

// 각 제스처를 2번씩 = 총 8장
const sequence = [];
chosenGestures.forEach(g => {
  sequence.push({ ...g, round: 1 });
  sequence.push({ ...g, round: 2 });
});

const COUNTDOWN_MS = 3000;
const RESET_GAP_MS = 1200;         // 촬영 후 다음 동작 준비 텀

// ---------- 상태 ----------
let handLandmarker = null;
let video = document.getElementById('video');
let overlay = document.getElementById('overlay');
let octx = overlay.getContext('2d');

let currentIdx = 0;
let countdownStartTs = null;
let inResetGap = false;
let capturedPhotos = []; // { dataUrl, gestureName }
let lastVideoTime = -1;

const gestureNameEl = document.getElementById('gestureName');
const guideCaptionEl = document.getElementById('guideCaption');
const subStatusEl = document.getElementById('subStatus');
const progressTextEl = document.getElementById('progressText');
const countdownNumEl = document.getElementById('countdownNum');
const logArea = document.getElementById('logArea');
const errorBox = document.getElementById('errorBox');

// 동작별 설명 문구 (일러스트 없이 텍스트로만 안내)
const GUIDE_CAPTION = {
  v: '검지·중지를 펴서 브이 모양',
  thumbsup: '엄지만 세우고 나머지 손가락은 접기',
  tigerclaw: '손바닥이 보이게 들고, 손톱이 보일 정도로만 손가락을 살짝 구부리기',
  catears: '손목을 머리 위로 들고 손등이 보이게, 검지·중지를 벌려 손톱이 머리에 닿도록 굽히기 (한 손 OK)',
  cheekheart: '한손으로 반쪽 하트를 만들어 볼 옆에 대기 (한 손 OK)',
  bigheart: '양손을 둥글게 구부려 검지 끝은 위에서, 엄지 끝은 아래에서 맞닿게 하트 만들기',
  flower: '손가락을 붙여 펴고 턱 밑에 대기 (한 손 OK)',
  mouthpose: '검지손가락을 입꼬리 끝에 대기 (살짝 깨무는 느낌도 OK)',
  yahoo: '브이를 뒤집어서 손톱이 바닥을 향하게',
  palmpose: '손등이 보이게, 손가락을 사이사이 틈이 보이도록 쫙 펼치기 (한 손 OK)',
  rocknroll: '엄지·검지·새끼손가락은 펴고, 중지·약지는 완전히 접기',
};

function log(msg) {
  logArea.textContent = (new Date().toLocaleTimeString() + ' ' + msg + '\n' + logArea.textContent).slice(0, 2000);
}


// ---------- 카메라 + 모델 초기화 ----------
async function init() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 }, audio: false });
    video.srcObject = stream;
    await new Promise(res => video.onloadedmetadata = res);
    video.play();
    overlay.width = video.videoWidth;
    overlay.height = video.videoHeight;
  } catch (err) {
    errorBox.innerHTML = `<div class="error-box">카메라를 사용할 수 없습니다: ${err.message}<br>
    (claude.ai 미리보기 iframe에서는 카메라 권한이 막혀있을 수 있습니다. 이 HTML 파일을 다운로드한 뒤 로컬 브라우저에서 직접 열어서 테스트해주세요.)</div>`;
    return;
  }

  subStatusEl.textContent = 'AI 모델을 불러오는 중입니다...';
  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );
  handLandmarker = await HandLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
      delegate: "GPU"
    },
    runningMode: "VIDEO",
    numHands: 8   // 여럿이 함께 찍을 때 대비 (최대 4명 x 양손)
  });

  log('모델 로드 완료, 인식 시작');
  showCurrentGesture();
  requestAnimationFrame(loop);
}

// ---------- 제스처 판정 함수 ----------
// 핵심: 각 함수는 "손 하나"를 판정하는 컴포넌트 체크이고,
// makeChecker()가 화면에 감지된 모든 손(=모든 사람)이 전부 만족해야 true를 반환하도록 감싸준다.
function dist(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}
function isFingerExtended(lm, tipIdx, pipIdx) {
  return (lm[pipIdx].y - lm[tipIdx].y) > 0.02;
}
function isFingerCurled(lm, tipIdx, pipIdx) {
  return !isFingerExtended(lm, tipIdx, pipIdx);
}
function wristDist(lm, idx) {
  return dist(lm[idx], lm[0]);
}
// 손목 대비 손끝 거리 "비율"로 굽힘 정도를 판정 (절대 좌표 차이가 아니라 비율이라
// 카메라와의 거리(확대/축소)나 손이 살짝 돌아간 각도에도 흔들리지 않고 비교적 안정적임)
function isFingerFolded(lm, tipIdx, mcpIdx) {
  return wristDist(lm, tipIdx) < wristDist(lm, mcpIdx) * 1.35;
}
// 관절(중간 마디, pipIdx)을 꼭짓점으로 mcp-pip-tip 세 점이 이루는 각도.
// 손가락이 곧게 펴져 있으면 180도에 가깝고, 굽을수록 작아진다. y좌표 비교와 달리
// 팔/손이 화면에서 어떤 각도로 기울어(대각선으로 들어올린 경우 등) 있어도 값이 흔들리지 않는다.
function fingerBendAngle(lm, mcpIdx, pipIdx, tipIdx) {
  const v1 = { x: lm[mcpIdx].x - lm[pipIdx].x, y: lm[mcpIdx].y - lm[pipIdx].y };
  const v2 = { x: lm[tipIdx].x - lm[pipIdx].x, y: lm[tipIdx].y - lm[pipIdx].y };
  const m1 = Math.hypot(v1.x, v1.y), m2 = Math.hypot(v2.x, v2.y);
  const cosA = (v1.x * v2.x + v1.y * v2.y) / (m1 * m2 || 1);
  return Math.acos(Math.min(1, Math.max(-1, cosA))) * 180 / Math.PI;
}
// 손목 기준 거리 "비율"로 손가락 펴짐/구부림을 판정 (손이 기울어지거나 회전해도 안정적으로 동작)
function curlRatio(lm, tipIdx, mcpIdx) {
  return wristDist(lm, tipIdx) / (wristDist(lm, mcpIdx) || 1);
}

// 손등/손바닥 방향 판정: 손목(0)->검지뿌리(5), 손목(0)->새끼뿌리(17) 두 벡터의
// 2D 외적(z성분) 부호가 손이 뒤집히면(=손등/손바닥이 바뀌면) 반전되는 성질을 이용.
// 실제 테스트 결과 손바닥이 보일 때 통과되는 반대 증상이 있어(카메라에 넘기는 원본 프레임이
// 화면에 보이는 거울 모드와 좌우가 반대라 handedness 라벨 기준이 뒤집혀 있었음)
// FLIP_HAND_ORIENTATION을 true로 두어 부호를 반전시킴.
const FLIP_HAND_ORIENTATION = true;
function isBackOfHandFacing(lm, handednessLabel) {
  const wrist = lm[0], idx = lm[5], pinky = lm[17];
  const v1x = idx.x - wrist.x, v1y = idx.y - wrist.y;
  const v2x = pinky.x - wrist.x, v2y = pinky.y - wrist.y;
  const crossZ = v1x * v2y - v1y * v2x;
  let backFacing = handednessLabel === 'Right' ? crossZ < 0 : crossZ > 0;
  if (FLIP_HAND_ORIENTATION) backFacing = !backFacing;
  return backFacing;
}

function vComponent(lm) {
  const indexExt = isFingerExtended(lm, 8, 6);
  const middleExt = isFingerExtended(lm, 12, 10);
  const ringCurl = isFingerCurled(lm, 16, 14);
  const pinkyCurl = isFingerCurled(lm, 20, 18);
  return indexExt && middleExt && ringCurl && pinkyCurl;
}

function thumbsUpComponent(lm) {
  const indexCurl = isFingerCurled(lm, 8, 6);
  const middleCurl = isFingerCurled(lm, 12, 10);
  const ringCurl = isFingerCurled(lm, 16, 14);
  const pinkyCurl = isFingerCurled(lm, 20, 18);
  const thumbUp = lm[4].y < lm[2].y - 0.03;
  return indexCurl && middleCurl && ringCurl && pinkyCurl && thumbUp;
}

// 어흥(호랑이 발톱): 손바닥이 보이도록 들고, 손톱이 보이는 정도로만 살짝 구부린 상태
// (기존엔 거의 주먹 수준으로 구부려야 인식돼서, 살짝만 구부려도 인식되도록 범위를 완화함)
function tigerClawComponent(lm) {
  const fingers = [[8, 5], [12, 9], [16, 13], [20, 17]]; // [tip, mcp]
  return fingers.every(([tip, mcp]) => {
    const dTip = wristDist(lm, tip);
    const dMcp = wristDist(lm, mcp);
    // 거의 다 펴진 상태(1.5 이상)만 아니면 되고, 주먹처럼 완전히 접힌 상태(0.75 미만)만 아니면 인정
    return dTip > dMcp * 0.75 && dTip < dMcp * 1.5;
  });
}

// 고양이 귀: 검지·중지를 곧게 편 채로 넓게 벌려서(V보다 더 벌어진 삼각형 모양), 손목이
// 손끝보다 위(더 높은 곳)에 있도록 손을 뒤집어(손등이 보이게) 손끝이 머리에 닿는 모양.
// (직전 버전은 손목-손끝 위아래 관계를 안 봐서, 손가락이 위로 향한 일반 브이 사인도
//  똑같이 통과돼버렸음. "손목이 손끝보다 위에 있는지"만 다시 검사해서 방향을 구분함 -
//  손목/손끝 두 점만 비교하므로, 팔 전체가 대각선으로 들려도 흔들리지 않음)
function catEarsComponent(lm) {
  // 검지·중지가 곧게 펴져 있는지 (완전히 편 손가락은 관절 각도가 180도에 가까움)
  const indexStraight = fingerBendAngle(lm, 5, 6, 8) > 140;
  const middleStraight = fingerBendAngle(lm, 9, 10, 12) > 140;
  if (!indexStraight || !middleStraight) return false;

  // 약지·소지는 주먹처럼 접혀야 함 (관절 각도 기준, 회전에 영향받지 않음)
  const ringCurl = fingerBendAngle(lm, 13, 14, 16) < 140;
  const pinkyCurl = fingerBendAngle(lm, 17, 18, 20) < 140;

  // 손목(0)이 검지·중지 손끝보다 위(작은 y)에 있어야 함 = 손등 쪽이 위, 손끝이 머리 쪽 아래
  // (일반 브이 사인처럼 손가락이 손목보다 위로 향하면 이 조건에서 걸러짐)
  const wristAboveFingers = lm[0].y < lm[8].y && lm[0].y < lm[12].y;

  // 손목(0)을 꼭짓점으로 검지 끝(8)·중지 끝(12)까지의 벌어진 각도
  const v1 = { x: lm[8].x - lm[0].x, y: lm[8].y - lm[0].y };
  const v2 = { x: lm[12].x - lm[0].x, y: lm[12].y - lm[0].y };
  const mag1 = Math.hypot(v1.x, v1.y), mag2 = Math.hypot(v2.x, v2.y);
  const cosA = (v1.x * v2.x + v1.y * v2.y) / (mag1 * mag2 || 1);
  const angleDeg = Math.acos(Math.min(1, Math.max(-1, cosA))) * 180 / Math.PI;
  const angleOk = angleDeg > 10; // 브이 사인보다 넉넉히 벌어져 있으면 인정 (상한 없음)

  const nearHead = lm[8].y < 0.6 && lm[12].y < 0.6; // 손끝이 머리 높이(화면 위쪽) 부근에 위치

  return ringCurl && pinkyCurl && indexStraight && middleStraight && wristAboveFingers && angleOk && nearHead;
}

// 볼하트: 엄지와 검지를 붙이지 않고, 살짝 구부려 반쪽 하트(둥근 곡선) 모양을 만들어
// 볼 옆에 대는 동작. (기존엔 엄지-검지 끝을 붙이는 핀치 조건이라 사실상 손하트와
// 똑같이 판정됐음. 붙지 않고 벌어진 채 곡선을 이루는 상태로 조건을 바꿈)
// 얼굴 가까이서 촬영하면(=손이 화면을 크게 채우면) 절대 좌표 기준 거리는 훨씬 커지고,
// 손이 살짝 돌아가면 y좌표 차이로 굽힘을 판정하는 방식이 흔들리기 쉬움. 그래서 모든
// 거리를 "손 크기(손목~중지 마디)" 대비 비율로 계산해 카메라 거리·각도 변화에 안정적으로 만듦.
function cheekHeartComponent(lm) {
  const handScale = wristDist(lm, 9) || 0.001;
  const middleFolded = isFingerFolded(lm, 12, 9);
  const ringFolded = isFingerFolded(lm, 16, 13);
  const pinkyFolded = isFingerFolded(lm, 20, 17);
  const gapRatio = dist(lm[4], lm[8]) / handScale;
  const gapOk = gapRatio > 0.15 && gapRatio < 1.5; // 완전히 붙지도(핀치), 너무 벌어지지도 않게
  const upperArea = lm[8].y < 0.8; // 얼굴~볼 높이 부근 (가까이 촬영해도 되도록 여유 있게)
  return middleFolded && ringFolded && pinkyFolded && gapOk && upperArea;
}

// 꽃받침: 손가락을 붙여서 펴고, 턱 밑 높이에 대는 모양 (한 손)
function flowerComponent(lm) {
  const allExt = [[8, 6], [12, 10], [16, 14], [20, 18]].every(([t, p]) => isFingerExtended(lm, t, p));
  const closeGaps = dist(lm[8], lm[12]) < 0.06 && dist(lm[12], lm[16]) < 0.06 && dist(lm[16], lm[20]) < 0.06;
  const nearFace = lm[0].y > 0.25 && lm[0].y < 0.75; // 얼굴~턱 높이 부근
  return allExt && closeGaps && nearFace;
}

// 숭이포즈: 검지손가락 끝이 입꼬리(입 주변) 높이에 있으면 인정.
// 손톱쪽을 깨물듯 살짝 구부려도, 그냥 붙여도 되므로 검지 자체의 펴짐/구부림은 따지지 않음.
function mouthPoseComponent(lm) {
  const middleCurl = curlRatio(lm, 12, 9) < 1.1;
  const ringCurl = curlRatio(lm, 16, 13) < 1.1;
  const pinkyCurl = curlRatio(lm, 20, 17) < 1.1;
  const indexNearMouth = lm[8].y > 0.3 && lm[8].y < 0.78; // 입 주변 높이 범위
  return middleCurl && ringCurl && pinkyCurl && indexNearMouth;
}

// 야호포즈: 브이를 뒤집은 모양. 검지·중지가 펴진 채로 "뿌리보다 아래쪽"을 향해야 함(손톱이 바닥 방향)
function yahooComponent(lm) {
  const indexExtended = curlRatio(lm, 8, 5) > 1.15;
  const middleExtended = curlRatio(lm, 12, 9) > 1.15;
  const pointingDown = (lm[8].y - lm[5].y) > 0.03 && (lm[12].y - lm[9].y) > 0.03;
  const ringCurl = curlRatio(lm, 16, 13) < 1.05;
  const pinkyCurl = curlRatio(lm, 20, 17) < 1.05;
  return indexExtended && middleExtended && pointingDown && ringCurl && pinkyCurl;
}

// 놀라는 포즈(id: palmpose): 손등이 카메라를 향하고, 엄지 포함 5손가락이 모두 펴져서
// 서로 붙지 않고 사이사이 틈이 벌어져 있어야 함. 두 손 중 한 손만 이 모양이어도 인정.
function palmPoseHandComponent(lm, handedness) {
  const fourExtended = [[8, 5], [12, 9], [16, 13], [20, 17]]
    .every(([tip, mcp]) => curlRatio(lm, tip, mcp) > 1.15);
  const thumbExtended = curlRatio(lm, 4, 2) > 1.15;
  const palmWidth = dist(lm[5], lm[17]) || 1; // 손 크기로 정규화
  const gaps = [dist(lm[4], lm[8]), dist(lm[8], lm[12]), dist(lm[12], lm[16]), dist(lm[16], lm[20])];
  const spread = gaps.every(g => (g / palmWidth) > 0.35); // 손가락 사이 틈이 충분히 벌어져야 함
  const backFacing = isBackOfHandFacing(lm, handedness);
  return fourExtended && thumbExtended && spread && backFacing;
}

// 락앤롤 포즈 🤟: 엄지·검지·새끼는 펴고, 중지·약지는 완전히 접기
function rockAndRollComponent(lm) {
  const indexExtended = curlRatio(lm, 8, 5) > 1.15;
  const pinkyExtended = curlRatio(lm, 20, 17) > 1.15;
  const thumbExtended = curlRatio(lm, 4, 2) > 1.15;
  const middleCurl = curlRatio(lm, 12, 9) < 1.05;
  const ringCurl = curlRatio(lm, 16, 13) < 1.05;
  return indexExtended && pinkyExtended && thumbExtended && middleCurl && ringCurl;
}

const COMPONENTS = {
  v: vComponent,
  thumbsup: thumbsUpComponent,
  tigerclaw: tigerClawComponent,
  catears: catEarsComponent,
  cheekheart: cheekHeartComponent,
  flower: flowerComponent,
  mouthpose: mouthPoseComponent,
  yahoo: yahooComponent,
  palmpose: palmPoseHandComponent,
  rocknroll: rockAndRollComponent,
};

// 화면에 감지된 손이 몇 개든(=몇 명이든) 전부 만족해야 인정.
// handedness(왼손/오른손)가 필요한 컴포넌트(손바닥 포즈 등)에도 쓸 수 있도록 함께 전달.
function makeChecker(gestureId, minHands) {
  const component = COMPONENTS[gestureId];
  return function (hands, handednesses) {
    if (hands.length < minHands) return false;
    return hands.every((lm, i) => component(lm, handednesses ? handednesses[i] : undefined));
  };
}

// 양손하트(양손 결합): 주먹을 맞대는 게 아니라, 양손을 둥글게 구부려
// 검지 끝(하트 윗부분 골)과 엄지 끝(하트 아랫부분 뾰족한 점)이 각각 서로 맞닿도록
// 만드는 동작.
// 다른 제스처와 달리 "손끼리의 관계"를 봐야 해서 별도 로직으로 처리.
function bigHeartChecker(hands) {
  if (hands.length !== 2) return false; // 정확히 두 손일 때만 판정 (양손 or 두 사람이 손을 맞댈 때)
  const [a, b] = hands;
  const indexTipsClose = dist(a[8], b[8]) < 0.12; // 검지 끝끼리 맞닿음 (하트 윗부분 골)
  const thumbTipsClose = dist(a[4], b[4]) < 0.12; // 엄지 끝끼리 맞닿음 (하트 아랫부분 꼭짓점)
  // 검지가 엄지보다 위에 있어야 함 (손을 뒤집어서 맞대는 등의 오검출 방지)
  const orientedUp = a[8].y < a[4].y && b[8].y < b[4].y;
  return indexTipsClose && thumbTipsClose && orientedUp;
}

const SPECIAL_CHECKERS = {
  bigheart: bigHeartChecker,
};

const CHECKERS = {};
GESTURES.forEach(g => {
  CHECKERS[g.id] = SPECIAL_CHECKERS[g.id] || makeChecker(g.id, g.minHands);
});

// ---------- 메인 루프 ----------
function loop() {
  if (!handLandmarker) return;
  if (currentIdx >= sequence.length) return; // 8장 다 찍음

  if (video.currentTime !== lastVideoTime) {
    lastVideoTime = video.currentTime;
    const result = handLandmarker.detectForVideo(video, performance.now());
    const hands = result.landmarks || [];
    // 손등/손바닥 방향 판정에 필요한 왼손/오른손 라벨 추출 (손바닥 포즈에서 사용)
    const handednesses = (result.handednesses || []).map(h => (h && h[0] && h[0].categoryName) || 'Right');
    const gestureDef = sequence[currentIdx];
    const ok = !inResetGap && CHECKERS[gestureDef.id](hands, handednesses);
    drawOverlay(result, ok);

    if (!inResetGap) {
      handleDetection(ok, hands.length, gestureDef.minHands);
    }
  }
  requestAnimationFrame(loop);
}

function drawOverlay(result, ok) {
  octx.clearRect(0, 0, overlay.width, overlay.height);
  if (!result.landmarks) return;
  octx.fillStyle = ok ? '#5ee08a' : '#ffd54a'; // 동작 만족 시 초록, 아니면 기존 노랑
  for (const hand of result.landmarks) {
    for (const pt of hand) {
      octx.beginPath();
      octx.arc(pt.x * overlay.width, pt.y * overlay.height, 3, 0, Math.PI * 2);
      octx.fill();
    }
  }
}

function handleDetection(ok, handCount, minHands) {
  const countInfo = handCount > 0 ? ` · 감지된 손 ${handCount}개` : ' · 손이 감지되지 않음';
  if (countdownStartTs !== null) {
    // 카운트다운 진행 중
    if (!ok) {
      // 자세 풀림 -> 카운트다운 취소
      countdownStartTs = null;
      countdownNumEl.textContent = '';
      subStatusEl.innerHTML = `<span class="hint-wait">자세가 풀렸어요. 모든 사람이 다시 동작을 만들어주세요${countInfo}</span>`;
      return;
    }
    const elapsed = performance.now() - countdownStartTs;
    const remain = Math.ceil((COUNTDOWN_MS - elapsed) / 1000);
    if (elapsed >= COUNTDOWN_MS) {
      capturePhoto();
    } else {
      countdownNumEl.textContent = String(Math.max(remain, 1));
      subStatusEl.innerHTML = '<span class="hint-hold">자세 유지!</span>';
    }
    return;
  }

  if (ok) {
    // 동작이 인식되는 즉시 바로 촬영 카운트다운 시작 (기다리는 시간 없이 바로 진행)
    countdownStartTs = performance.now();
  } else {
    const needMsg = minHands > 1 ? ` (최소 ${minHands}개 손 필요)` : '';
    subStatusEl.innerHTML = `<span class="hint-wait">동작을 인식하는 중...${needMsg}${countInfo}</span>`;
  }
}

function capturePhoto() {
  const gestureDef = sequence[currentIdx];
  const tmp = document.createElement('canvas');
  tmp.width = video.videoWidth;
  tmp.height = video.videoHeight;
  const tctx = tmp.getContext('2d');
  // 거울모드로 저장 (실제 보이는 대로)
  tctx.translate(tmp.width, 0);
  tctx.scale(-1, 1);
  tctx.drawImage(video, 0, 0, tmp.width, tmp.height);
  const dataUrl = tmp.toDataURL('image/jpeg', 0.92);
  capturedPhotos.push({ dataUrl, gestureName: gestureDef.name, round: gestureDef.round });
  log(`촬영 완료: ${gestureDef.name} (${gestureDef.round}/2) [${capturedPhotos.length}/8]`);

  countdownStartTs = null;
  countdownNumEl.textContent = '';
  currentIdx++;

  if (currentIdx >= sequence.length) {
    subStatusEl.textContent = '8장 촬영 완료! 선택 화면으로 이동합니다';
    setTimeout(showSelectView, 800);
    return;
  }

  inResetGap = true;
  subStatusEl.textContent = '손을 한 번 내려주세요';
  showCurrentGesture();
  setTimeout(() => { inResetGap = false; }, RESET_GAP_MS);
}

function showCurrentGesture() {
  const g = sequence[currentIdx];
  gestureNameEl.textContent = g.name;
  progressTextEl.textContent = `${currentIdx + 1} / ${sequence.length}번째 촬영  (${g.name.split(' ')[0]} - ${g.round}/2회차)`;
  guideCaptionEl.textContent = GUIDE_CAPTION[g.id] || '';
}

// ---------- 선택 화면 ----------
let selectedIds = []; // capturedPhotos index 순서대로 저장 (배치 순서)

function showSelectView() {
  document.getElementById('captureStage').style.display = 'none';
  document.getElementById('statusBar').style.display = 'none';
  document.getElementById('selectView').style.display = 'block';

  const grid = document.getElementById('grid8');
  grid.innerHTML = '';
  capturedPhotos.forEach((photo, i) => {
    const div = document.createElement('div');
    div.className = 'thumb';
    div.innerHTML = `<img src="${photo.dataUrl}"><span class="badge">${photo.gestureName.split(' ')[0]} ${photo.round}</span><span class="order"></span>`;
    div.onclick = () => toggleSelect(i, div);
    grid.appendChild(div);
  });
}

function toggleSelect(i, div) {
  const idx = selectedIds.indexOf(i);
  if (idx >= 0) {
    selectedIds.splice(idx, 1);
    div.classList.remove('selected');
  } else {
    if (selectedIds.length >= 4) return;
    selectedIds.push(i);
    div.classList.add('selected');
  }
  document.querySelectorAll('.thumb').forEach((el, elIdx) => {
    const orderIdx = selectedIds.indexOf(elIdx);
    el.querySelector('.order').textContent = orderIdx >= 0 ? (orderIdx + 1) : '';
  });
  document.getElementById('selCount').textContent = selectedIds.length;
  document.getElementById('composeBtn').disabled = selectedIds.length !== 4;
}

let selectedLayout = 'vertical';
document.getElementById('layoutVertical').onclick = () => setLayout('vertical');
document.getElementById('layout2x2').onclick = () => setLayout('2x2');
function setLayout(l) {
  selectedLayout = l;
  document.getElementById('layoutVertical').classList.toggle('active', l === 'vertical');
  document.getElementById('layout2x2').classList.toggle('active', l === '2x2');
}

document.getElementById('composeBtn').onclick = composeFinal;

// ---------- 4컷 합성 ----------
async function composeFinal() {
  document.getElementById('selectView').style.display = 'none';
  document.getElementById('resultView').style.display = 'block';

  const imgs = await Promise.all(selectedIds.map(i => loadImage(capturedPhotos[i].dataUrl)));
  const canvas = document.getElementById('finalCanvas');
  const ctx = canvas.getContext('2d');

  const PAD = 20, GAP = 12, FOOTER = 50;
  const cellW = 300, cellH = 225;

  if (selectedLayout === 'vertical') {
    canvas.width = cellW + PAD * 2;
    canvas.height = cellH * 4 + GAP * 3 + PAD * 2 + FOOTER;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    imgs.forEach((img, i) => {
      const y = PAD + i * (cellH + GAP);
      drawCover(ctx, img, PAD, y, cellW, cellH);
    });
  } else {
    canvas.width = cellW * 2 + GAP + PAD * 2;
    canvas.height = cellH * 2 + GAP + PAD * 2 + FOOTER;
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    const positions = [[0,0],[1,0],[0,1],[1,1]];
    imgs.forEach((img, i) => {
      const [cx, cy] = positions[i];
      const x = PAD + cx * (cellW + GAP);
      const y = PAD + cy * (cellH + GAP);
      drawCover(ctx, img, x, y, cellW, cellH);
    });
  }

  ctx.fillStyle = '#888';
  ctx.font = '12px sans-serif';
  ctx.textAlign = 'center';
  const dateStr = new Date().toLocaleDateString('ko-KR');
  ctx.fillText(`AI FOUR-CUT · ${dateStr}`, canvas.width / 2, canvas.height - FOOTER / 2);
}

function loadImage(src) {
  return new Promise(res => {
    const img = new Image();
    img.onload = () => res(img);
    img.src = src;
  });
}

function drawCover(ctx, img, x, y, w, h) {
  const scale = Math.max(w / img.width, h / img.height);
  const sw = w / scale, sh = h / scale;
  const sx = (img.width - sw) / 2, sy = (img.height - sh) / 2;
  ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
}

document.getElementById('downloadBtn').onclick = () => {
  const canvas = document.getElementById('finalCanvas');
  const a = document.createElement('a');
  a.download = 'ai-four-cut.jpg';
  a.href = canvas.toDataURL('image/jpeg', 0.95);
  a.click();
};

document.getElementById('restartBtn').onclick = () => location.reload();

init();
</script>
